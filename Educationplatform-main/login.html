<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Hassel Edu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 mt-5">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <a class="navbar-brand fw-bold logo fs-3 text-dark text-decoration-none" href="index.html">
                                Hassel<span style="color: #ff7e27;">Edu</span>
                            </a>
                            <h3 class="fw-bold mt-3">Teacher Login</h3>
                            <p class="text-secondary">Please login to your account</p>
                        </div>
                        <form>
                            <div class="mb-3">
                                <label class="form-label text-secondary">Email address</label>
                                <input type="email" class="form-control form-control-lg" placeholder="name@example.com">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-secondary">Password</label>
                                <input type="password" class="form-control form-control-lg"
                                    placeholder="Enter password">
                            </div>
                            <button type="button" class="btn btn-lg w-100 text-white"
                                style="background-color: #ff7e27;">Login</button>
                        </form>
                        <div class="text-center mt-4">
                            <a href="index.html" class="text-decoration-none text-secondary">← Back to Home</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
